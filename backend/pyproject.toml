[project]
name = "order-system-backend"
version = "1.0.0"
description = "AWS serverless order management system - Lambda backend"
requires-python = ">=3.12"
# Runtime code uses only the Python standard library and boto3, which the
# AWS Lambda Python runtime already provides. Nothing else is packaged.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "local", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "local", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S", "I"]
ignore = ["S101", "E501", "S105", "S106", "B008", "UP047"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
